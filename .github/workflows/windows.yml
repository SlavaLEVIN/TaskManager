name: Windows build
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.8'
          architecture: x64
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/unit -v --junitxml=windows-unit-tests.xml
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: windows
      - name: Capture light and dark interface on Windows
        run: python scripts/capture_ui.py --output windows-screenshots
        env:
          QT_QPA_PLATFORM: windows
      - run: python -m PyInstaller --clean --noconfirm packaging/task_manager.spec
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $exePath = (Resolve-Path 'dist\TaskManager.exe').Path
          $appProcess = Start-Process -FilePath $exePath -PassThru
          try {
            $opened = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $appProcess.Refresh()
              if ($appProcess.HasExited) { throw "TaskManager exited during startup: $($appProcess.ExitCode)" }
              $windows = Get-Process -Name TaskManager -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exePath -and $_.MainWindowTitle -eq 'Менеджер задач' }
              if ($windows) { $opened = $true; break }
            }
            if (-not $opened) { throw "TaskManager main window did not open within 30 seconds" }
            Write-Output "TaskManager main window opened successfully"
          } finally {
            taskkill /PID $appProcess.Id /T /F
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TaskManager-Windows-x64
          path: |
            dist/TaskManager.exe
            windows-unit-tests.xml
            windows-screenshots/
            config/database.example.ini
            START_HERE_WINDOWS.md
            docs/UPDATE_1.3.1.md
