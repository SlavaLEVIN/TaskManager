name: Windows build
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.8'
          architecture: x64
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/unit -q --junitxml=windows-unit-tests.xml
        env:
          QT_QPA_PLATFORM: windows
      - name: Capture light and dark interface on Windows
        run: python scripts/capture_ui.py --output windows-screenshots
        env:
          QT_QPA_PLATFORM: windows
      - run: python -m PyInstaller --clean --noconfirm packaging/task_manager.spec
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $appProcess = Start-Process -FilePath 'dist\TaskManager.exe' -PassThru
          Start-Sleep -Seconds 12
          if ($appProcess.HasExited) { throw "TaskManager exited during startup: $($appProcess.ExitCode)" }
          $appProcess.Refresh()
          if ($appProcess.MainWindowTitle -ne 'Менеджер задач') { throw "Expected TaskManager main window, got: $($appProcess.MainWindowTitle)" }
          Write-Output "TaskManager main window opened successfully"
          Stop-Process -Id $appProcess.Id
      - uses: actions/upload-artifact@v4
        with:
          name: TaskManager-Windows-x64
          path: |
            dist/TaskManager.exe
            windows-unit-tests.xml
            windows-screenshots/
            config/database.example.ini
            START_HERE_WINDOWS.md
            docs/UPDATE_1.1.md
