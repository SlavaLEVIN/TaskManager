name: Windows build
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.8'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --clean --noconfirm packaging/task_manager.spec
      - run: python -m PyInstaller --clean --noconfirm packaging/setup_database.spec
      - run: python -m PyInstaller --clean --noconfirm packaging/update_database.spec
      - uses: actions/upload-artifact@v4
        with:
          name: TaskManager-Windows-x64
          path: |
            dist/TaskManager.exe
            dist/TaskManager-Setup.exe
            dist/TaskManager-Update.exe
