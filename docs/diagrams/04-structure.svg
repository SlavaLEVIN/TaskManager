<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="900" viewBox="0 0 1150 900" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#657f9c"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="30" y="35" xml:space="preserve" font-size="24" font-weight="600" fill="#173454">Структура программы</text><rect x="250" y="85" width="650" height="105" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="264" y="112" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Пользовательский интерфейс</text><text x="264" y="145" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Qt Widgets: вход, меню, задачи, пользователи, отчёты, справка</text><text x="264" y="166" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Модели таблиц и формы без SQL</text><rect x="335" y="235" width="480" height="95" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="349" y="262" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Presenter</text><text x="349" y="295" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Сессия, навигация, подготовка вызовов сервисов</text><rect x="335" y="375" width="480" height="85" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="349" y="402" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Worker / QRunnable</text><text x="349" y="435" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Фоновая очередь; Qt-сигналы в GUI-поток</text><rect x="225" y="510" width="700" height="110" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="239" y="537" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Бизнес-логика</text><text x="239" y="570" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">AuthService • UserService • TaskService • ReportService</text><text x="239" y="591" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Права, проверки, операции, правила Task / User / Category</text><rect x="300" y="670" width="550" height="85" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="314" y="697" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Подсистема хранения: Database</text><text x="314" y="730" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">psycopg2, соединение на операцию, commit / rollback</text><rect x="365" y="795" width="420" height="70" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="379" y="822" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">PostgreSQL</text><text x="379" y="855" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Общая БД в локальной сети</text><polyline points="575.0,190 575.0,235" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="575.0,330 575.0,375" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="575.0,460 575.0,510" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="575.0,620 575.0,670" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="575.0,755 575.0,795" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/></svg>