<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1100" viewBox="0 0 1300 1100" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#657f9c"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="30" y="35" xml:space="preserve" font-size="24" font-weight="600" fill="#173454">Функциональная схема A0 и декомпозиция A1 / A2</text><rect x="420" y="70" width="480" height="80" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="434" y="97" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Управление</text><text x="434" y="130" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Роли, переходы статусов, ограничения БД</text><rect x="30" y="220" width="300" height="110" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="44" y="247" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Вход</text><text x="44" y="280" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Реквизиты входа, команды</text><text x="44" y="301" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Поля задач и пользователей</text><rect x="440" y="210" width="420" height="130" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="454" y="237" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">A0 Управление задачами</text><text x="454" y="270" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Авторизация, операции с данными</text><text x="454" y="291" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Поиск, отчёты, экспорт</text><rect x="1000" y="210" width="270" height="140" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="1014" y="237" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Выход</text><text x="1014" y="270" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Доступные списки</text><text x="1014" y="291" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Подтверждения / ошибки</text><text x="1014" y="312" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Текстовые отчёты, CSV</text><rect x="440" y="395" width="420" height="80" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="454" y="422" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Механизмы</text><text x="454" y="455" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Qt-клиент, сервисы, PostgreSQL</text><polyline points="660.0,150 650.0,210" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="330,275.0 440,275.0" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="860,275.0 1000,280.0" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="650.0,395 650.0,340" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="560" xml:space="preserve" font-size="21" font-weight="600" fill="#173454">Декомпозиция A0</text><rect x="30" y="640" width="235" height="85" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="44" y="667" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Реквизиты входа</text><text x="44" y="700" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Логин и пароль</text><rect x="350" y="620" width="300" height="140" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="364" y="647" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">A1 Авторизация</text><text x="364" y="680" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Проверить логин и bcrypt</text><text x="364" y="701" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Определить пользователя</text><text x="364" y="722" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Сформировать Session(user_id)</text><rect x="840" y="620" width="410" height="215" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="854" y="647" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">A2 Операции с данными</text><text x="854" y="680" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Проверить актуальную роль</text><text x="854" y="701" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">CRUD, назначение, статусы</text><text x="854" y="722" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Поиск, фильтры, сортировка</text><text x="854" y="743" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Отчёты и CSV</text><text x="854" y="764" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Выдать результат или понятную ошибку</text><rect x="360" y="920" width="310" height="90" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="374" y="947" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">PostgreSQL</text><text x="374" y="980" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Пользователи, категории, задачи</text><rect x="840" y="915" width="410" height="100" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="854" y="942" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Команды и правила</text><text x="854" y="975" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Ввод, условия отбора, выбранные ID</text><text x="854" y="996" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Права и предметные ограничения</text><polyline points="265,682.5 350,690.0" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="650,690.0 840,727.5" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="680" y="677" xml:space="preserve" font-size="13" font-weight="400" fill="#173454">ID сессии</text><polyline points="515.0,920 500.0,760" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1045.0,835 1045,870 705,870 705,965 670,965.0" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="700" y="925" xml:space="preserve" font-size="13" font-weight="400" fill="#173454">чтение / запись</text><polyline points="1045.0,915 1045.0,835" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/></svg>