<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#657f9c"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="30" y="35" xml:space="preserve" font-size="24" font-weight="600" fill="#173454">Граф состояний интерфейса</text><rect x="45" y="85" width="300" height="120" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="59" y="112" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Авторизация</text><text x="59" y="145" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Ошибка → остаться на входе</text><text x="59" y="166" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Успех → главное меню</text><rect x="515" y="85" width="290" height="120" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="529" y="112" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Главное меню</text><text x="529" y="145" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Текущий логин и роль</text><text x="529" y="166" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Разделы по полномочиям</text><rect x="45" y="340" width="300" height="110" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="59" y="367" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Работа с задачами</text><text x="59" y="400" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Данные и действия по роли</text><text x="59" y="421" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Выбор задач для отчёта</text><rect x="490" y="340" width="330" height="110" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="504" y="367" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Пользователи [ADMIN]</text><text x="504" y="400" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Создание / логин и роль</text><text x="504" y="421" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Сброс пароля / удаление</text><rect x="925" y="340" width="305" height="110" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="939" y="367" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Отчёты и экспорт</text><text x="939" y="400" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Текст для обеих ролей</text><text x="939" y="421" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">CSV только ADMIN</text><rect x="925" y="85" width="305" height="120" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="939" y="112" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Справка</text><text x="939" y="145" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Из рабочего раздела</text><text x="939" y="166" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Назад в тот же раздел</text><polyline points="345,145.0 515,145.0" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="365" y="132" xml:space="preserve" font-size="13" font-weight="400" fill="#173454">успешный вход</text><polyline points="660.0,205 660,255 195,255 195.0,340" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="660.0,205 655.0,340" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="660.0,205 660,255 1077,255 1077.5,340" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="805,145.0 925,145.0" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="838" y="135" xml:space="preserve" font-size="13" font-weight="400" fill="#173454">открыть</text><polyline points="195.0,450 195,510 1077,510 1077.5,450" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="555" y="500" xml:space="preserve" font-size="13" font-weight="400" fill="#173454">выбранные задачи</text><rect x="80" y="650" width="380" height="115" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="94" y="677" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Любой текущий экран</text><text x="94" y="710" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Закрыть приложение / завершить работу</text><text x="94" y="731" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Logout → очистить данные и авторизация</text><rect x="610" y="650" width="350" height="115" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="624" y="677" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Подтверждение выхода</text><text x="624" y="710" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Отмена → исходный экран и ввод</text><text x="624" y="731" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Выйти → завершение</text><rect x="1030" y="670" width="210" height="80" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="1044" y="697" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Завершение</text><text x="1044" y="730" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Освобождение ресурсов</text><polyline points="460,707.5 610,707.5" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="960,707.5 1030,710.0" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="975" y="694" xml:space="preserve" font-size="13" font-weight="400" fill="#173454">Выйти</text><polyline points="785.0,765 785,830 270,830 270.0,765" fill="none" stroke="#657f9c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="505" y="820" xml:space="preserve" font-size="13" font-weight="400" fill="#173454">Отмена</text><text x="45" y="915" xml:space="preserve" font-size="15" font-weight="400" fill="#173454">Из разделов доступно главное меню; справка возвращает в предыдущий раздел. Logout доступен во всех рабочих разделах.</text><text x="45" y="945" xml:space="preserve" font-size="15" font-weight="400" fill="#173454">Подтверждённый выход во время запроса ожидает его завершения. Отмена выхода не сохраняет форму автоматически.</text></svg>