<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#657f9c"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="30" y="35" xml:space="preserve" font-size="24" font-weight="600" fill="#173454">Варианты использования</text><g stroke="#2459bd" stroke-width="2" fill="none"><circle cx="120.0" cy="364" r="12"/><path d="M120.0 376v32m-25 -20h50m-25 20l-22 27m22 -27l22 27"/></g><text x="45" y="445" xml:space="preserve" font-size="16" font-weight="600" fill="#173454">Пользователь</text><g stroke="#2459bd" stroke-width="2" fill="none"><circle cx="1170.0" cy="364" r="12"/><path d="M1170.0 376v32m-25 -20h50m-25 20l-22 27m22 -27l22 27"/></g><text x="1080" y="445" xml:space="preserve" font-size="16" font-weight="600" fill="#173454">Администратор</text><rect x="390" y="70" width="460" height="115" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="404" y="97" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Обе роли</text><text x="404" y="130" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Войти / выйти / открыть справку</text><text x="404" y="151" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Поиск, фильтры, сортировка в пределах прав</text><rect x="255" y="245" width="390" height="170" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="269" y="272" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Действия пользователя</text><text x="269" y="305" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Просмотреть свои назначенные задачи</text><text x="269" y="326" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Изменить статус своей задачи</text><text x="269" y="347" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Сформировать отчёт по своим задачам</text><rect x="730" y="245" width="330" height="380" rx="8" fill="#f3f7fd" stroke="#476a91" stroke-width="1.5"/><text x="744" y="272" xml:space="preserve" font-size="17" font-weight="600" fill="#173454">Действия администратора</text><text x="744" y="305" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Все задачи / задачи исполнителя</text><text x="744" y="326" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Создать / редактировать / удалить задачу</text><text x="744" y="347" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Назначить ответственного</text><text x="744" y="368" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Изменить статус по общему правилу</text><text x="744" y="389" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Создать / удалить пользователя</text><text x="744" y="410" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Изменить логин и роль пользователя</text><text x="744" y="431" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Сбросить пароль</text><text x="744" y="452" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Отчёт по выбранным задачам</text><text x="744" y="473" xml:space="preserve" font-size="14" font-weight="400" fill="#173454">Экспорт задач / пользователей в CSV</text><polyline points="195,397.5 255,330.0" fill="none" stroke="#657f9c" stroke-width="1.7"/><polyline points="1080,397.5 1060,435.0" fill="none" stroke="#657f9c" stroke-width="1.7"/><polyline points="120.0,350 120,127 390,127.5" fill="none" stroke="#657f9c" stroke-width="1.7"/><polyline points="1170.0,350 1170,127 850,127.5" fill="none" stroke="#657f9c" stroke-width="1.7"/><text x="45" y="745" xml:space="preserve" font-size="16" font-weight="400" fill="#173454">Роль определяется после авторизации в одной программе. Управление категориями через GUI отсутствует.</text><text x="45" y="782" xml:space="preserve" font-size="16" font-weight="400" fill="#173454">Редактирование пользователя включено явно; назначение исполнителя выполняется вручную.</text></svg>